<script type="module">
  import { watchAuthForNav, db } from './js/auth.js';
  import { initLangToggle } from './js/i18n.js';
  import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  watchAuthForNav();
  initLangToggle();

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // 관리자 화면에서 리치텍스트 에디터로 작성한 공지는 HTML로 저장되어 있어 그대로 보여주고,
  // 예전 방식(문단 사이 빈 줄 구분의 일반 텍스트)으로 저장된 공지는 이전처럼 문단으로 변환한다.
  function renderBody(body) {
    const s = String(body == null ? '' : body);
    if (/<[a-z][\s\S]*>/i.test(s)) return s;
    return s.split(/\n\s*\n/).map((p) => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
  }
  function fmtDate(ts) {
    if (!ts || !ts.toDate) return '';
    const d = ts.toDate();
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }

  const listEl = document.getElementById('noticeList');

  try {
    const snap = await getDocs(collection(db, 'notices'));
    const notices = snap.docs
      .map((d) => d.data())
      .filter((n) => n.published !== false)
      .sort((a, b) => {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        const ta = a.created_at && a.created_at.toDate ? a.created_at.toDate().getTime() : 0;
        const tb = b.created_at && b.created_at.toDate ? b.created_at.toDate().getTime() : 0;
        return tb - ta;
      });

    if (notices.length === 0) {
      listEl.innerHTML = `<p style="text-align:center;color:var(--ink-faint);padding:40px 0;">아직 등록된 공지사항이 없어요.</p>`;
    } else {
      listEl.innerHTML = notices
        .map(
          (n) => `
        <div class="notice-item">
          <h2>${n.pinned ? '<span class="badge-sm">고정</span>' : ''} ${esc(n.title)}</h2>
          <div class="date">${fmtDate(n.created_at)}</div>
          ${renderBody(n.body)}
        </div>`
        )
        .join('');
    }
  } catch (e) {
    listEl.innerHTML = `<p style="text-align:center;color:var(--ink-faint);padding:40px 0;">공지사항을 불러오지 못했어요.</p>`;
  }
</script>
