name = "gieoksoop-share"
main = "src/index.js"
compatibility_date = "2026-09-17"

# 기존 gieoksoop.com 정적 사이트(별도 배포)와 같은 도메인에서
# /share/*, /api/share/* 경로만 이 Worker가 처리하도록 라우트를 지정.
# 나머지 경로(/, /login.html 등)는 그대로 기존 정적 사이트가 서빙함.
# (주의: 이 routes 키는 반드시 아래 [[r2_buckets]]/[vars] 같은 표(table) 선언보다
#  먼저 와야 한다 — TOML에서 표 선언 뒤에 오는 키는 그 표에 속해버린다.)
routes = [
  { pattern = "gieoksoop.com/share/*", zone_name = "gieoksoop.com" },
  { pattern = "gieoksoop.com/api/share/*", zone_name = "gieoksoop.com" },
  { pattern = "gieoksoop.com/api/payments/*", zone_name = "gieoksoop.com" },
  { pattern = "gieoksoop.com/api/inquiry/*", zone_name = "gieoksoop.com" }
]

# 인생챕터 외부공유용 R2 버킷 바인딩.
[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "gieoksoop-shares"

[vars]
FIREBASE_PROJECT_ID = "gieoksoop"
# 문의 알림 메일(선택). RESEND_API_KEY(secret)가 없으면 메일은 건너뛰고 문의 접수/답변은 그대로 동작한다.
# MAIL_FROM의 도메인은 Resend에서 인증돼 있어야 한다. 새 문의 알림 수신 주소는 INQUIRY_NOTIFY_TO(기본 gieoksoop@gmail.com).
MAIL_FROM = "기억숲 <noreply@gieoksoop.com>"
# 관리자 화면의 AI 답변 초안(선택). ANTHROPIC_API_KEY(secret)가 없으면 버튼이 "설정 전"이라고 안내한다.
# 모델이 퇴역/변경되면 이 값만 바꿔 재배포하면 된다.
DRAFT_MODEL = "claude-sonnet-4-5"

# 정기결제 자동 실행(cron). 매시 정각에 돌면서 다음 결제일이 지난 구독자를 찾아 자동으로 재결제한다.
# 이용 기간·다음 결제일은 한국시간 00:00 단위라 00:00 KST(=UTC 15:00) 실행분이 정기결제를 처리하고,
# 나머지 시각은 결제 실패 재시도(BILLING_RETRY_DELAYS_HOURS)와 구독 만료 처리를 위한 것이다.
# 실행 로직은 src/payments.js의 runScheduledBilling(), 호출부는 src/index.js의 scheduled 핸들러.
[triggers]
crons = ["0 * * * *"]

# Workers Logs: cron(정기결제) 실행 결과와 오류(billing_query_failed 등)를 대시보드에서 나중에도 볼 수 있게 한다.
[observability]
enabled = true
