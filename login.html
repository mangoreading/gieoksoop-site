<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 기억숲</title>
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/site.css">
<script>
  // PC 앱 로그인 팝업 감지(2026.09.21): PC 앱이 이 페이지를 ?callback_port=<포트>
  // 로 열면(작은 브라우저 창), 렌더링 전에 최대한 빨리 popup-mode 클래스를 붙여서
  // css/site.css의 팝업 전용 스타일(네비/푸터 숨김, 여백 축소)이 바로 적용되게 한다.
  (function(){
    try{
      var params = new URLSearchParams(window.location.search);
      var port = params.get('callback_port');
      if(port && /^\d{1,5}$/.test(port) && Number(port) > 0 && Number(port) < 65536){
        document.documentElement.classList.add('popup-mode');
      }
    }catch(e){}
  })();
</script>
</head>
<body>

<nav class="sitenav">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo-mark.png" alt="기억숲"></a>
    <div class="links">
      <a href="guide.html" class="hide-mobile">가이드</a>
      <a href="pricing.html">구독결제</a>
      <a href="login.html" data-auth="guest">로그인</a>
      <a href="account.html" data-auth="user" style="display:none">내 계정</a>
      <div class="lang-toggle">
        <button type="button" data-lang-btn="ko" class="active">KR</button>
        <button type="button" data-lang-btn="en">EN</button>
        <span class="lang-toast"></span>
      </div>
    </div>
  </div>
</nav>

<section class="center-card" style="padding:64px 0 80px;">
  <div class="wrap">
    <div class="card">
      <h2>로그인</h2>
      <p class="desc">기억숲 계정으로 로그인하세요.</p>

      <div class="form-error" id="errorBox"></div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">이메일</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <a href="forgot-password.html" class="form-forgot" id="toForgot">비밀번호를 잊으셨나요?</a>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">로그인</button>
      </form>

      <p class="form-switch">아직 계정이 없으신가요? <a href="signup.html" id="toSignup">회원가입</a></p>
    </div>
  </div>
</section>

<footer>
  <div class="brand">기억숲 — LIFE ARCHIVE</div>
  <div>&copy; 2026 기억숲. All rights reserved.</div>
  <div class="foot-links">
    <a href="guide.html">사용가이드</a>
    <a href="notice.html">공지사항</a>
    <a href="terms.html">이용약관</a>
    <a href="privacy.html">개인정보처리방침</a>
  </div>
  <div class="foot-biz">
    스콜레에듀케이션 · 대표 : 김미정 · 사업자등록번호 : 262-57-01028<br>
    서울특별시 양천구 목동동로 293 현대41타워 22층<br>
    이메일 : <a href="mailto:support@gieoksoop.com">support@gieoksoop.com</a> · 통신판매업신고번호 : 123-4567-890
  </div>
</footer>

<script type="module">
  import { logIn, watchAuthForNav, friendlyAuthError } from './js/auth.js';
  import { initLangToggle } from './js/i18n.js';
  watchAuthForNav();
  initLangToggle();

  // PC 앱 로그인 연동: ?callback_port= 가 있으면 회원가입/비밀번호 찾기 전환 링크와
  // 로그인 후 이동 경로에도 유지 (2026.09.21: 비밀번호 찾기로 넘어갈 때도
  // 팝업 모드가 안 끊기도록 forgot-password.html 링크에도 같은 처리 추가 — 이게
  // 없으면 그 페이지에서 네비/footer가 다시 보였다)
  const toSignup = document.getElementById('toSignup');
  if (window.location.search) toSignup.href = 'signup.html' + window.location.search;
  const toForgot = document.getElementById('toForgot');
  if (window.location.search) toForgot.href = 'forgot-password.html' + window.location.search;

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';

    try {
      const user = await logIn(email, password);
      await redirectAfterAuth(user);
    } catch (err) {
      errorBox.textContent = friendlyAuthError(err);
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = '로그인';
    }
  });

  // PC 앱 팝업으로 로그인했을 때, 예전엔 무조건 account.html로 이동한 뒤 그
  // 페이지의 onAuthStateChanged가 다시 감지해서 localhost로 리다이렉트했다.
  // 그러다 보니 account.html이 실제로 한 번 로드되면서(Firebase 재초기화 포함)
  // "내 계정" 화면(제목·이메일 등)이 짧게라도 보였다가 사라지는 게 사용자
  // 눈에 거슬렸다(2026.09.21 피드백: "닫히기 전에 전혀 무관한 페이지가 잠깐
  // 보여진다"). 이메일 인증까지 이미 끝난 사용자라면 account.html을 아예
  // 거치지 않고 여기서 바로 localhost 콜백으로 보내 그 깜빡임을 없앤다.
  // (이메일 미인증 계정은 account.html의 인증 안내 화면이 실제로 필요하니
  // 그 경우만 그대로 account.html로 보낸다.)
  async function redirectAfterAuth(user) {
    const params = new URLSearchParams(window.location.search);
    const callbackPort = params.get('callback_port');
    const isValidPort = !!callbackPort && /^\d{1,5}$/.test(callbackPort) && Number(callbackPort) > 0 && Number(callbackPort) < 65536;
    if (isValidPort && user && user.emailVerified) {
      try {
        const idToken = await user.getIdToken();
        const refreshToken = user.refreshToken;
        window.location.href = `http://localhost:${callbackPort}/callback?token=${encodeURIComponent(idToken)}&refresh=${encodeURIComponent(refreshToken)}`;
        return;
      } catch (e) {
        // 토큰을 못 받아오면 기존처럼 account.html에서 다시 시도
      }
    }
    window.location.href = 'account.html' + window.location.search;
  }
</script>

</body>
</html>
